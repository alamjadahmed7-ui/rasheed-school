<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة مدرسة راشد بن الوليد</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-brand { font-weight: bold; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .btn-custom { border-radius: 8px; }
    </style>
</head>
<body>

    <!-- الهيدر وشريط التنقل -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-school me-2"></i> مدرسة راشد بن الوليد</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- نموذج إضافة طالب -->
            <div class="col-md-4">
                <div class="card p-3">
                    <h5 class="card-title mb-3"><i class="fas fa-user-plus text-primary me-2"></i> إضافة طالب جديد</h5>
                    <form id="studentForm">
                        <div class="mb-3">
                            <label class="form-label">اسم الطالب الثلاثي والقبيلة</label>
                            <input type="text" id="studentName" class="form-control" placeholder="أدخل اسم الطالب..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">الصف والشعبة</label>
                            <select id="studentClass" class="form-select" required>
                                <option value="العاشر / 1">العاشر / 1</option>
                                <option value="العاشر / 2">العاشر / 2</option>
                                <option value="العاشر / 3">العاشر / 3</option>
                                <option value="العاشر / 4">العاشر / 4</option>
                                <option value="العاشر / 5">العاشر / 5</option>
                                <option value="العاشر / 6">العاشر / 6</option>
                                <option value="العاشر / 7">العاشر / 7</option>
                                <option value="العاشر / 8">العاشر / 8</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">رقم هاتف ولي الأمر (للبوت)</label>
                            <input type="tel" id="parentPhone" class="form-control" placeholder="968XXXXXXXX" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-custom"><i class="fas fa-save me-1"></i> حفظ الطالب في القائمة</button>
                    </form>
                </div>
            </div>

            <!-- قائمة الطلاب ورصد الغياب -->
            <div class="col-md-8">
                <div class="card p-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="card-title m-0"><i class="fas fa-users text-primary me-2"></i> قوائم الطلاب المسجلين</h5>
                        <span class="badge bg-secondary" id="studentCount">0 طالب</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>اسم الطالب</th>
                                    <th>الصف والشعبة</th>
                                    <th>هاتف ولي الأمر</th>
                                    <th>إجراءات الإرسال</th>
                                </tr>
                            </thead>
                            <tbody id="studentTableBody">
                                <!-- سيتم إضافة الطلاب هنا تلقائياً -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // بيانات Green API الخاصة بالحساب
        const ID_INSTANCE = '710722792988';
        const API_TOKEN = '76787f6d8a7a494b862ca499f9b66567f32498a2eba5447fa7';

        let students = JSON.parse(localStorage.getItem('rasheed_students')) || [];

        function saveAndRender() {
            localStorage.setItem('rasheed_students', JSON.stringify(students));
            renderStudents();
        }

        function renderStudents() {
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';
            document.getElementById('studentCount').innerText = `${students.length} طالب`;

            students.forEach((student, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${student.name}</strong></td>
                    <td><span class="badge bg-info text-dark">${student.classGroup}</span></td>
                    <td>${student.phone}</td>
                    <td>
                        <button class="btn btn-danger btn-sm btn-custom me-1" onclick="sendAbsentNotice(${index})">
                            <i class="fab fa-whatsapp me-1"></i> إرسال غياب
                        </button>
                        <button class="btn btn-outline-secondary btn-sm btn-custom" onclick="deleteStudent(${index})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('studentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('studentName').value;
            const classGroup = document.getElementById('studentClass').value;
            let phone = document.getElementById('parentPhone').value.trim();

            // تنظيف وتنظيم رقم الهاتف ليكون بالصيغة الدولية
            if (!phone.startsWith('968') && phone.length === 8) {
                phone = '968' + phone;
            }

            students.push({ name, classGroup, phone });
            saveAndRender();
            this.reset();
        });

        function deleteStudent(index) {
            if(confirm('هل أنت تأكد من مسح هذا الطالب؟')) {
                students.splice(index, 1);
                saveAndRender();
            }
        }

        // دالة إرسال التنبيه التلقائي عبر Green API
        async function sendAbsentNotice(index) {
            const student = students[index];
            const chatId = `${student.phone}@c.us`;
            const message = `المكرم ولي أمر الطالب/ ${student.name} المحترم،\nالسلام عليكم ورحمة الله وبركاته،\n\nنود إفادتكم بأن ابنكم غائب اليوم عن الحضور في مدرسة راشد بن الوليد (${student.classGroup}).\nيرجى التواصل مع إدارة المدرسة لمعرفة الأسباب.`;

            try {
                const response = await fetch(`https://7107.api.greenapi.com/waInstance${ID_INSTANCE}/sendMessage/${API_TOKEN}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatId: chatId, message: message })
                });

                if (response.ok) {
                    alert(`تم إرسال إشعار الغياب بنجاح لولي أمر الطالب ${student.name}`);
                } else {
                    alert('حدث خطأ أثناء الإرسال، ارفع التقرير لإدارة السيرفر.');
                }
            } catch (error) {
                console.error(error);
                alert('فشل الاتصال بخدمة Green API');
            }
        }

        renderStudents();
    </script>
</body>
</html>
