<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الطلاب - مدرسة راشد بن الوليد للبنين (10-12)</title>
    <!-- استيراد مكتبات التصميم والأيقونات والخطوط -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .glass-header { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%); }
        .gradient-btn { background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%); }
        .gradient-btn:hover { background: linear-gradient(135deg, #4338ca 0%, #2e1065 100%); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

    <!-- الهيدر الرئيسي -->
    <header class="glass-header text-white shadow-2xl border-b-4 border-amber-400">
        <div class="max-w-7xl mx-auto p-6 md:p-8 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-5">
                <div class="bg-amber-400/20 p-4 rounded-2xl border border-amber-400/30 text-amber-300 text-4xl shadow-inner">
                    <i class="fa-solid fa-school"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <span class="bg-amber-400 text-slate-950 font-black text-xs px-3 py-0.5 rounded-full shadow">سلطنة عُمان</span>
                        <span class="bg-indigo-900/80 text-amber-300 border border-indigo-700 text-xs font-mono px-3 py-0.5 rounded-full dir-ltr">🔗 rasheed-school.om</span>
                    </div>
                    <h1 class="text-2xl md:text-3xl font-black tracking-wide">مدرسة راشد بن الوليد للبنين (10-12)</h1>
                    <p class="text-slate-300 text-sm mt-1 font-medium">لوحة المعلمين المبسطة لرصد الحصص والغياب (إشراف: أ. سعيد / أ. عادل)</p>
                </div>
            </div>

            <!-- إحصائيات وحالة السيرفرات -->
            <div class="grid grid-cols-3 gap-3 w-full md:w-auto">
                <div class="bg-white/10 backdrop-blur-md p-3 px-4 rounded-2xl border border-white/10 text-center">
                    <span class="block text-xs text-indigo-200">إجمالي الطلاب</span>
                    <span id="statTotalStudents" class="text-2xl font-black text-amber-300">0</span>
                </div>
                <div class="bg-white/10 backdrop-blur-md p-3 px-4 rounded-2xl border border-white/10 text-center">
                    <span class="block text-xs text-indigo-200">سجلات اليوم</span>
                    <span id="statAbsences" class="text-2xl font-black text-rose-400">0</span>
                </div>
                <div class="bg-white/10 backdrop-blur-md p-3 px-4 rounded-2xl border border-white/10 text-center">
                    <span class="block text-xs text-indigo-200">السيرفرات</span>
                    <span class="text-xs font-bold text-emerald-300 block mt-2">🟢 Server 1 & 2</span>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 mt-8 space-y-6">

        <!-- أزرار التنقل الرئيسية -->
        <div class="flex flex-wrap gap-2 border-b border-slate-300 pb-2">
            <button onclick="switchTab('students')" id="btnStudents" class="px-5 py-3 font-bold text-sm rounded-xl bg-indigo-900 text-white shadow transition flex items-center gap-2">
                <i class="fa-solid fa-users"></i> إدارة وقوائم الطلاب
            </button>
            <button onclick="switchTab('absences')" id="btnAbsences" class="px-5 py-3 font-bold text-sm rounded-xl bg-white text-slate-600 hover:bg-slate-200 transition flex items-center gap-2">
                <i class="fa-solid fa-clipboard-user"></i> رصد الغياب والحصص (للمعلمين)
            </button>
            <button onclick="switchTab('reports')" id="btnReports" class="px-5 py-3 font-bold text-sm rounded-xl bg-white text-slate-600 hover:bg-slate-200 transition flex items-center gap-2">
                <i class="fa-solid fa-unlock text-emerald-600"></i> تقارير الإدارة (مفتوحة)
            </button>
            <button onclick="switchTab('servers')" id="btnServers" class="px-5 py-3 font-bold text-sm rounded-xl bg-white text-slate-600 hover:bg-slate-200 transition flex items-center gap-2">
                <i class="fa-solid fa-database text-emerald-600"></i> إعدادات السيرفرين والحفظ
            </button>
        </div>

        <!-- ================= تبويب 1: إدارة الطلاب ================= -->
        <div id="tabStudents" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit space-y-4">
                <h3 class="font-bold text-slate-800 border-b pb-3 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-indigo-600"></i> إضافة طالب جديد للقائمة
                </h3>
                <form id="addStudentForm" class="space-y-3 text-xs font-semibold">
                    <div>
                        <label class="block mb-1 text-slate-600">اسم الطالب الثلاثي والقبيلة:</label>
                        <input type="text" id="newStudentName" required placeholder="أدخل اسم الطالب..." class="w-full p-2.5 border rounded-xl bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block mb-1 text-slate-600">الصف والشعبة (من 1 إلى 8):</label>
                        <select id="newStudentClass" required class="w-full p-2.5 border rounded-xl bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="">اختر الصف والشعبة...</option>
                            <option value="العاشر / 1">العاشر / 1</option><option value="العاشر / 2">العاشر / 2</option><option value="العاشر / 3">العاشر / 3</option><option value="العاشر / 4">العاشر / 4</option>
                            <option value="العاشر / 5">العاشر / 5</option><option value="العاشر / 6">العاشر / 6</option><option value="العاشر / 7">العاشر / 7</option><option value="العاشر / 8">العاشر / 8</option>
                            <option value="الحادي عشر / 1">الحادي عشر / 1</option><option value="الحادي عشر / 2">الحادي عشر / 2</option><option value="الحادي عشر / 3">الحادي عشر / 3</option><option value="الحادي عشر / 4">الحادي عشر / 4</option>
                            <option value="الحادي عشر / 5">الحادي عشر / 5</option><option value="الحادي عشر / 6">الحادي عشر / 6</option><option value="الحادي عشر / 7">الحادي عشر / 7</option><option value="الحادي عشر / 8">الحادي عشر / 8</option>
                            <option value="الثاني عشر / 1">الثاني عشر / 1</option><option value="الثاني عشر / 2">الثاني عشر / 2</option><option value="الثاني عشر / 3">الثاني عشر / 3</option><option value="الثاني عشر / 4">الثاني عشر / 4</option>
                            <option value="الثاني عشر / 5">الثاني عشر / 5</option><option value="الثاني عشر / 6">الثاني عشر /
